services:
  stream:
    build: .
    init: true
    environment:
      REELTONE_SERVER_URL: ${REELTONE_SERVER_URL:-}
    ports:
      - "127.0.0.1:${STREAM_LOCAL_PORT:-3102}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
